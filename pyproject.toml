[project]
name = "mac-personal-mcp"
version = "0.1.0"
description = "MCP server for iMessage, Apple Notes, and Contacts on macOS. Read-only by default."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.1.1",
]
keywords = ["mcp", "macos", "imessage", "apple-notes", "contacts", "claude"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]

[project.scripts]
mac-personal-mcp = "mac_personal_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mac_personal_mcp"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
